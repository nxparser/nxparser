/*
 * Plugins
 */
plugins {
    id 'maven-publish'
}
apply plugin: 'java'


group = 'com.github.nxparser'

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
}





/*
 * Configuration
 */
description = 'NxParser'




/*
 * Projects
 */
allprojects {
	
	
	/*
	 * Configuration
	 */
	version = '4.0.1-SNAPSHOT'
	
	
}




/*
 * Subprojects
 */
subprojects {
	
	
	/*
	 * Plugins
	 */
	apply plugin: 'eclipse'
	apply plugin: 'java'
	apply plugin: 'maven-publish'
	
	
	
	/*
	 * Repositories
	 */
	repositories {
		mavenLocal()
		mavenCentral()
		maven {
			url "https://jitpack.io"
		}
	}
	
	
	/*
	 * Dependencies
	 */
	dependencies {
		
		
		/*
		 * Compile Dependencies
		 */
		
		// NxParser
		testCompile group: 'junit', name: 'junit', version:'4.13.1'
		
		
	}
	

    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java
            }
        }
    }
}
